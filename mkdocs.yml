site_name: AcessWeb
site_description: Avaliação de acessibilidade dos sites Samsung e Apple
site_url: https://unb-ihc.github.io/IHC_2026.1_Grupo03/
repo_url: https://github.com/UnB-IHC/IHC_2026.1_Grupo03
repo_name: UnB-IHC/IHC_2026.1_Grupo03

theme:
  name: material
  language: pt-BR
  logo: assets/images/acessweb-logo.svg
  favicon: assets/images/acessweb-logo.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Ativar modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Ativar modo claro

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables

plugins:
  - search:
      lang: pt

extra_css:
  - stylesheets/extra.css

copyright: Grupo 03 — Interação Humano-Computador, UnB, 1.2026

nav:
  - Início: index.md
  - Avaliação Apple:
      - Resumo: apple/resumo.md
  - Avaliação Samsung:
      - Resumo: samsung/resumo.md
  - Comparação entre Sites: comparacao/comparacao.md
  - Aplicação de Ferramenta:
      - WAVE: ferramenta/wave.md
  - Anexos:
      - Checklist Apple: anexos/anexo_apple.md
      - Checklist Samsung: anexos/anexo_samsung.md
