site_name: AcessWeb
site_description: Checklist interativo de acessibilidade digital
site_url: https://unb-ihc.github.io/IHC_2026.1_Grupo03/
repo_url: https://github.com/UnB-IHC/IHC_2026.1_Grupo03
repo_name: UnB-IHC/IHC_2026.1_Grupo03

theme:
  name: material
  language: pt-BR
  logo: assets/images/acessweb-logo.svg
  favicon: assets/images/acessweb-logo.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Ativar modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Ativar modo claro

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - tables

plugins:
  - search:
      lang: pt

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/checklist-progress.js

copyright: Grupo 03 — Interação Humano-Computador, UnB, 1.2026

nav:
  - Início: index.md
  - Ferramentas: ferramentas.md
  - Desenvolvimento: checklist/desenvolvimento-e-testes.md
  - Privacidade: checklist/privacidade-e-seguranca.md
  - Navegação: checklist/navegacao.md
  - Conteúdo: checklist/conteudo.md
  - Design: checklist/design.md
  - Conformidade: checklist/conformidade-e-robustez.md
  - Compreensão: checklist/compreensao-e-entrada.md
  - Nielsen: checklist/heuristicas-de-nielsen.md
